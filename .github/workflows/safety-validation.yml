name: Safety error handling validation

on:
  workflow_dispatch:
  push:
    branches: ['feature/SCRUM-37-manejo-de-errores']
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  safety-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
      - name: Portable model and audio tests
        run: swift test
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate --spec project.yml
      - name: Choose simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; d=json.load(sys.stdin); print(next(x["udid"] for devices in d["devices"].values() for x in devices if x["name"].startswith("iPhone")))')
          echo "SIMULATOR_ID=$DEVICE_ID" >> "$GITHUB_ENV"
      - name: iOS tests with synthetic frames
        run: >-
          xcodebuild test -project lumio.xcodeproj -scheme lumio
          -destination "platform=iOS Simulator,id=$SIMULATOR_ID"
          -resultBundlePath SafetyTests.xcresult CODE_SIGNING_ALLOWED=NO
