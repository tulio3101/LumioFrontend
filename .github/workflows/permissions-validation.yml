name: Permissions validation

on:
  workflow_dispatch:
  push:
    branches: ['HU-Solicitar-Permisos-de-Forma-Accesible']
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  permissions-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
      - name: Portable tests
        run: swift test
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate --spec project.yml
      - name: Choose an available iPhone simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; d=json.load(sys.stdin); print(next(x["udid"] for devices in d["devices"].values() for x in devices if x["name"].startswith("iPhone")))')
          echo "SIMULATOR_ID=$DEVICE_ID" >> "$GITHUB_ENV"
      - name: iOS simulator tests
        run: >-
          xcodebuild test -project lumio.xcodeproj -scheme lumio
          -destination "platform=iOS Simulator,id=$SIMULATOR_ID"
          CODE_SIGNING_ALLOWED=NO
