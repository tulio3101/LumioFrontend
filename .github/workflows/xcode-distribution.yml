name: Xcode Program Compilation and Distribution

on:
  push:
    branches:
      - main
      - develop
      - staging
      - 'feature/**'
      - 'fix/**'
      - 'SCRUM-**'
      - 'HU-Solicitar-Permisos-de-Forma-Accesible'

  pull_request:
    branches:
      - main
      - develop

env:
  PROJECT: ${{ vars.PROJECT }}
  SCHEME: ${{ vars.SCHEME }}
  APP_NAME: ${{ vars.APP_NAME }}

jobs:

  build-ios:
    name: Build iOS App
    runs-on: macos-15

    steps:
      - name: Get code
        uses: actions/checkout@v7

      - name: Setup Xcode
        run: |
            sudo xcode-select -s \
             /Applications/Xcode_26.2.app/Contents/Developer
            xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Verify project
        run: xcodebuild -list -project "$PROJECT"

      - name: Compile without signature
        run: |
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/$APP_NAME.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Generate IPA without sign
        run: |
            set -euo pipefail

            APP="$RUNNER_TEMP/$APP_NAME.xcarchive/Products/Applications/$APP_NAME.app"

            test -d "$APP"

            mkdir -p staging/Payload

            ditto "$APP" "staging/Payload/$APP_NAME.app"

            cd staging
            zip -qry "../$APP_NAME-unsigned.ipa" Payload

      - name: Validate generated IPA
        run: |
            set -euo pipefail
            test -s "$APP_NAME-unsigned.ipa"
            unzip -t "$APP_NAME-unsigned.ipa"

      - name: Save IPA for next job
        uses: actions/upload-artifact@v7
        with:
          name: intermediate-ipa
          path: ${{ env.APP_NAME }}-unsigned.ipa
          retention-days: 1
          if-no-files-found: error

  publish-ipa:
    name: Publish IPA
    needs: build-ios
    runs-on: ubuntu-latest

    steps:
      - name: Download compiled IPA
        uses: actions/download-artifact@v8
        with:
          name: intermediate-ipa
          path: ./dist

      - name: Validate IPA file
        run: |
            test -s "dist/$APP_NAME-unsigned.ipa"
            unzip -t "dist/$APP_NAME-unsigned.ipa"

      - name: Publish IPA in GitHub
        uses: actions/upload-artifact@v7
        with:
          path: dist/${{ env.APP_NAME }}-unsigned.ipa
          archive: false
          retention-days: 30
          if-no-files-found: error
