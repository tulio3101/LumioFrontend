
name: lumio

options:
  bundleIdPrefix: com.lumio
  developmentLanguage: es

targets:
  lumio:
    type: application
    platform: iOS
    deploymentTarget: "16.0"

    sources:
      - path: Sources/LumioFrontend
      - path: Resources/Assets.xcassets
      # Xcode compiles .mlpackage → .mlmodelc via coremlc (Compile Sources build phase).
      # Loaded at runtime with Bundle.main.url(forResource:withExtension:"mlmodelc").
      - path: Resources/yolo26n_640_int8.mlpackage

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lumio.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: lumio
        INFOPLIST_KEY_CFBundleDisplayName: Lumio
        PRODUCT_MODULE_NAME: LumioFrontend
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "Lumio usa la cámara para detectar obstáculos y avisarte por audio."
        GENERATE_INFOPLIST_FILE: YES
        # Se combina con las claves generadas: permisos y configuración de Lumio.
        INFOPLIST_FILE: Resources/Info.plist
        SWIFT_VERSION: "5.0"

  lumioTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Tests/LumioFrontendTests
      # Pruebas de la pila de detección (Safety): deben correr en el build de Xcode,
      # igual que el testTarget SafetyTests declarado en Package.swift (xtool).
      - path: Tests/SafetyTests
    dependencies:
      - target: lumio
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"

schemes:
  lumio:
    build:
      targets:
        lumio: all
    run:
      config: Debug
    test:
      targets:
        - lumioTests
    archive:
      config: Release
    management:
      shared: true
