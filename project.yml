
name: lumio

options:
  bundleIdPrefix: com.lumio
  developmentLanguage: es

targets:
  lumio:
    type: application
    platform: iOS
    deploymentTarget: "16.0"

    sources:
      - path: Sources/LumioFrontend
        # MLModels/ contiene el .mlmodelc precompilado SOLO para SwiftPM/xtool (Bundle.module).
        # Se excluye del target de Xcode para no empaquetar dos copias del modelo: Xcode compila
        # el .mlpackage de abajo a su propio .mlmodelc.
        excludes:
          - "MLModels"
      - path: Resources/Assets.xcassets
      # Xcode compiles .mlpackage → .mlmodelc via coremlc (Compile Sources build phase).
      # Loaded at runtime with Bundle.main.url(forResource:withExtension:"mlmodelc").
      - path: Resources/yolo26n_640_int8.mlpackage

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lumio.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: lumio
        PRODUCT_MODULE_NAME: LumioFrontend
        # Única fuente de verdad del Info.plist: el archivo Resources/Info.plist (incluye
        # permisos, display name, región y ciclo de vida). Sin GENERATE_INFOPLIST_FILE ni
        # INFOPLIST_KEY_* para que ningún build lo reescriba.
        INFOPLIST_FILE: Resources/Info.plist
        SWIFT_VERSION: "5.0"

  lumioTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Tests/LumioFrontendTests
      # Pruebas de la pila de detección (Safety): deben correr en el build de Xcode,
      # igual que el testTarget SafetyTests declarado en Package.swift (xtool).
      - path: Tests/SafetyTests
    dependencies:
      - target: lumio
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"

schemes:
  lumio:
    build:
      targets:
        lumio: all
    run:
      config: Debug
    test:
      targets:
        - lumioTests
    archive:
      config: Release
    management:
      shared: true
